name: Apple build and simulator tests
on:
  push:
    branches: [main]
    paths: ['ios/**', 'localization/**', 'tools/*localization*', 'tools/*apple*', '.github/workflows/apple.yml', 'app/src/main/cpp/ram_kernels*', 'app/src/main/cpp/compute/compute_cpu_kernels*', 'app/src/main/cpp/compute/compute_common*']
  pull_request:
    paths: ['ios/**', 'localization/**', 'tools/*localization*', 'tools/*apple*', '.github/workflows/apple.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, xcode-27]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test on available iPhone and iPad simulators
        run: python3 tools/test-apple.py --ci
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: apple-${{ matrix.image }}
          path: |
            .local/apple-ci
            !.local/apple-ci/device-build/**
            !.local/apple-ci/sim-build/**
            !.local/apple-ci/native-files/**
          if-no-files-found: error
          retention-days: 14
