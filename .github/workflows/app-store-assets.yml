name: App Store localized screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture real localized interfaces / 截取真实三语界面
        run: python3 tools/app-store-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: .local/app-store-screenshots
          if-no-files-found: error
          retention-days: 14
